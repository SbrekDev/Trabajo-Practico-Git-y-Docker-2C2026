<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razas de Perros — Explora y descubre</title>
  <meta name="description" content="Explora razas de perros con fotos e información. Datos e imágenes de la Dog CEO API." />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">🐶 Razas de Perros</h1>
      <p class="tagline">Explora las distintas razas, con fotos y datos de cada una.</p>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Filtros">
      <select id="breed-select" class="breed-select" aria-label="Seleccionar una raza">
        <option value="" disabled selected>Cargando razas...</option>
      </select>
    </section>

    <section class="gallery-section" aria-labelledby="gallery-heading">
      <h2 id="gallery-heading" class="section-title">Galería de la raza</h2>
      <div id="gallery-grid" class="breeds-grid">
        <p class="placeholder">Seleccioná una raza para ver sus fotos.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Fotos e información de razas: <a href="https://dog.ceo/dog-api/" target="_blank" rel="noopener noreferrer">Dog CEO API</a>.</p>
    </div>
  </footer>
</body>
</html>
