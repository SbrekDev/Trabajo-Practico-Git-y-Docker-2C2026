<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razas de Perros — Explora y descubre</title>
  <meta name="description" content="Explora razas de perros con fotos e información. Datos e imágenes de la Dog CEO API." />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <span class="logo">🐶 Razas de Perros</span>
      <a class="nav-link" href="https://dog.ceo/dog-api/" target="_blank" rel="noopener noreferrer">Dog CEO API</a>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1 class="hero-title">Descubrí tu raza favorita</h1>
      <p class="hero-subtitle">Explorá fotos e información de cientos de razas de perros.</p>
      <div class="hero-select">
        <label for="breed-select" class="visually-hidden">Elegí una raza</label>
        <select id="breed-select" class="breed-select" aria-label="Seleccionar una raza">
          <option value="" disabled selected>Cargando razas…</option>
        </select>
      </div>
    </div>
  </section>

  <main class="container">
    <section id="breed-info-section" class="breed-info-section" aria-labelledby="info-card" style="display: none;">
      <div id="breed-info-card" class="breed-info-card">
      </div>
    </section>

    <section class="gallery-section" aria-labelledby="gallery-heading">
      <h2 id="gallery-heading" class="section-title">Galería</h2>
      <div id="gallery-grid" class="breeds-grid">
        <p class="placeholder">Elegí una raza para ver sus fotos.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Fotos e información de razas: <a href="https://dog.ceo/dog-api/" target="_blank" rel="noopener noreferrer">Dog CEO API</a>.</p>
    </div>
  </footer>
</body>
</html>
